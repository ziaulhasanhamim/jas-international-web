services:
  - type: web
    name: jasinternation
    runtime: docker
    dockerfilePath: Dockerfile
    region: singapore
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__ApplyMigrations
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: Authentication__Google__ClientId
        sync: false
      - key: Authentication__Google__ClientSecret
        sync: false
      - key: Mail__Provider
        value: Brevo
      - key: Mail__Brevo__ApiKey
        sync: false
      - key: Mail__From
        value: info@jasinternational.com.bd
      - key: Mail__DisplayName
        value: JAS International
      - key: PublicBaseUrl
        value: https://jasinternational.com.bd
      - key: CLOUDINARY_URL
        sync: false
