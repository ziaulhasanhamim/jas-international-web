name: CI/CD Pipeline & Automated Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  build-and-test:
    name: Build & Verify (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (for Tailwind CSS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Compile Tailwind CSS
        run: npm run css

      - name: Install .NET 11 SDK
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh | bash -s -- --channel 11.0 --install-dir $HOME/.dotnet
          echo "$HOME/.dotnet" >> $GITHUB_PATH
          echo "DOTNET_ROOT=$HOME/.dotnet" >> $GITHUB_ENV

      - name: Verify .NET SDK Version
        run: dotnet --version

      - name: Restore NuGet Packages
        run: dotnet restore JASIntWeb.sln

      - name: Build Solution (Release)
        run: dotnet build JASIntWeb.sln -c Release --no-restore

      - name: Run Unit Tests
        run: dotnet test tests/JASIntWeb.Tests.Unit/JASIntWeb.Tests.Unit.csproj -c Release --no-build

      - name: Run Integration Tests
        run: dotnet test tests/JASIntWeb.Tests.Integration/JASIntWeb.Tests.Integration.csproj -c Release --no-build

      - name: Run SEO, Next-Gen Images & Health Verification Suite
        run: dotnet run --project tests/JASIntWeb.SeoChecks -c Release --no-build

      - name: Test Release Publish Packaging
        run: dotnet publish JASIntWeb/JASIntWeb.csproj -c Release --no-build -o ./publish-output

  release-and-deploy:
    name: Create Release & Deploy (CD)
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Next Version Tag
        id: semver
        run: |
          git fetch --tags --force
          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
          
          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="v1.0.0"
          else
            VERSION_RAW=${LATEST_TAG#v}
            MAJOR=$(echo "$VERSION_RAW" | cut -d. -f1)
            MINOR=$(echo "$VERSION_RAW" | cut -d. -f2)
            PATCH=$(echo "$VERSION_RAW" | cut -d. -f3)

            # Check commit history since last tag for semver bump
            LOG=$(git log "$LATEST_TAG"..HEAD --oneline || true)
            if echo "$LOG" | grep -qiE "breaking change|BREAKING:"; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
            elif echo "$LOG" | grep -qiE "^[a-f0-9]+ (feat|feature):"; then
              MINOR=$((MINOR + 1))
              PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi
            NEW_TAG="v$MAJOR.$MINOR.$PATCH"
          fi

          echo "Calculated new version tag: $NEW_TAG"
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Create Git Tag & Push
        env:
          TAG: ${{ steps.semver.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Automated Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.semver.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "Release $TAG" \
            --generate-notes

      - name: Trigger Automated Deployment
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_HOOK" ]; then
            echo "Triggering deployment webhook..."
            curl -fsS -X POST "$RENDER_HOOK"
            echo "Deployment webhook triggered successfully."
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not provided; deployment will proceed via Render GitHub branch auto-deploy."
          fi
