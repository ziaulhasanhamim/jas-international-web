name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore JASIntWeb.sln

      - name: Build solution
        run: dotnet build JASIntWeb.sln --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet run --project tests/JASIntWeb.Tests.Unit/JASIntWeb.Tests.Unit.csproj --no-build --configuration Release

      - name: Run Integration Tests
        run: dotnet run --project tests/JASIntWeb.Tests.Integration/JASIntWeb.Tests.Integration.csproj --no-build --configuration Release

      - name: Create GitHub Release with Tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v1.0.${{ github.run_number }}" --generate-notes
