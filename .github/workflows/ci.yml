name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - name: Cart navigation tests
        run: node --test tests/javascript/*.test.mjs
      - name: Generate and verify CSS
        run: |
          npm run css
          git diff --exit-code -- JASIntWeb/wwwroot/css/output.css
      - run: dotnet restore JASIntWeb.sln
      - run: dotnet build JASIntWeb.sln --no-restore --configuration Release
      - name: Verify EF model and migrations
        env:
          DB_URL: Host=localhost;Database=jas_ci;Username=postgres;Password=test_only
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/ef-tools" dotnet-ef --version 11.0.0
          "$RUNNER_TEMP/ef-tools/dotnet-ef" migrations has-pending-model-changes --project JASIntWeb --configuration Release --no-build
      - name: Unit tests
        run: dotnet run --project tests/JASIntWeb.Tests.Unit --no-build --configuration Release
      - name: SEO and Meta tests
        run: dotnet run --project tests/JASIntWeb.Tests.Seo --no-build --configuration Release
      - name: PostgreSQL integration tests
        run: dotnet run --project tests/JASIntWeb.Tests.Integration --no-build --configuration Release
      - name: Release publish (including WebAssembly trimming)
        run: dotnet publish JASIntWeb/JASIntWeb.csproj --no-restore --configuration Release --output "${{ runner.temp }}/publish"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: tests/**/TestResults/
          retention-days: 14
